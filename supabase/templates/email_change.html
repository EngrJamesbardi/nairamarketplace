<h2>Confirm your new email</h2>
<p>Confirm that you want to use {{ .NewEmail }} for your account.</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email_change&next=/account">Confirm new email</a></p>
<p>This link expires in 1 hour and can be used once. If you didn't request this, you can ignore this email.</p>
